[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-bridge"
version = "1.0.2"
description = "Multi-account Google Antigravity bridge with zero-drop quota rotation and agent adapters"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.scripts]
apx = "bridge.cli:main"
bridge = "bridge.cli:main"

[project.urls]
Homepage = "https://github.com/MYahyaImran/Antigravity-Bridge"
Repository = "https://github.com/MYahyaImran/Antigravity-Bridge.git"
Issues = "https://github.com/MYahyaImran/Antigravity-Bridge/issues"

[tool.setuptools]
packages = ["bridge", "bridge.adapters"]

[tool.setuptools.package-data]
"*" = ["static/*"]
